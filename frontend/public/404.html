<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Attendance System</title>
    <script>
      (function () {
        try {
          var path = window.location.pathname + window.location.search + window.location.hash;
          window.sessionStorage.setItem('attendance-system-redirect-path', path);
        } catch (error) {
          // Ignore storage issues and continue to the app root.
        }
        window.location.replace('/');
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to Attendance System...</p>
  </body>
</html>
